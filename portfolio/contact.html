<div class="page-hero">

    <h1>Get In <span class="gradient-text">Touch</span></h1>
    <p>Have a project, question, or opportunity? I’d be glad to hear from you.</p>
  </div>
</div>

<section>
  <div class="container contact-grid">
    <div class="reveal left">
      <a class="c-item" href="tel:+923166725762"><div class="ic"><i class="fa-solid fa-phone"></i></div><div><small>Phone</small><b>0316 6725762</b></div></a>
      <a class="c-item" href="https://wa.me/923166725762" target="_blank" rel="noopener"><div class="ic"><i class="fa-brands fa-whatsapp"></i></div><div><small>WhatsApp</small><b>Chat on WhatsApp</b></div></a>

    <form id="contactForm" class="reveal right">
      <div class="field"><label for="name">Your Name</label><input id="name" name="name" type="text" required placeholder="Enter your name"></div>
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required placeholder="you@example.com"></div>
      <div class="field"><label for="subject">Subject</label><input id="subject" name="subject" type="text" placeholder="What would you like to discuss?"></div>
      <div class="field"><label for="message">Message</label><textarea id="message" name="message" required placeholder="Tell me a little about your project..."></textarea></div>
      <button class="btn btn-primary" type="submit">Send Message ✉️</button>
      <p id="formMsg" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
